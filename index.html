 if(sent){$("bg").textContent="Gap";$("tx").innerHTML=shown?w[3].replace(new RegExp("\\b"+w[0]+"\\b","i"),m=>"<u>"+m+"</u>"):w[3].replace(new RegExp("\\b"+w[0]+"\\b","i"),"<u>"+"_".repeat(w[0].length)+"</u>");$("rev").style.display="";$("inp").placeholder="Gapdagi yetishmayotgan so'zni yozing"}
 else{$("bg").textContent="So'z";$("tx").innerHTML="<u>"+w[0].split("").map(()=>"_").join(" ")+"</u>";$("rev").style.display="none";$("inp").placeholder="So'zni yozing"}}
function show(){sent=Math.random()<.45&&!!cur()[3];shown=false;$("inp").value="";$("sp").textContent="";$("msg").textContent="";render();upd()}
function lvls(){$("lv").innerHTML="";Ls().forEach(l=>{const b=document.createElement("button");b.textContent=l==CK?"⭐ Mening":l;if(l==lvl)b.className="on";b.onclick=()=>{lvl=l;i=0;dI=0;lvls();show();vocab();if(!$("s3").classList.contains("hide"))dShow()};$("lv").appendChild(b)})}
function vocab(){$("vg").innerHTML="";D[lvl].forEach(w=>{const d=document.createElement("div"),k=learned.has(w[0])||w[4];d.className="v"+(k?"":" lock");
 d.innerHTML=k?`<button class="mt" aria-label="Speaking'da">${muted.has(w[0])?"🔕":"🔔"}</button>${lvl==CK?'<button class="dl" aria-label="O\'chirish">✕</button>':''}<div class="e">${w[2]}</div><b>${w[0]}</b><small>${w[1]}</small><i>${w[3]||""}</i>`:`<div class="e">🔒</div><b>?</b><small>Speaking'da oching</small>`;
 if(k)d.onclick=()=>say(w[3]||w[0]);
 const mt=d.querySelector(".mt");if(mt)mt.onclick=e=>{e.stopPropagation();muted.has(w[0])?muted.delete(w[0]):muted.add(w[0]);sm();vocab()};
 const x=d.querySelector(".dl");if(x)x.onclick=e=>{e.stopPropagation();custom=custom.filter(c=>c!==w);cs();if(!custom.length){delete D[CK];lvl=Ls()[0]}else D[CK]=custom;i=0;dI=0;lvls();show();vocab()};$("vg").appendChild(d)})}
$("hear").onclick=()=>say(sent?cur()[3]:cur()[0]);
$("rev").onclick=()=>{shown=!shown;render()};
const norm=s=>s.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(Boolean);
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("sp").innerHTML='<span class="bad">Brauzeringiz mikrofonni qo\'llamaydi (Chrome ishlating).</span>';return}
 const r=new SR(),b=$("mic");r.lang="en-US";r.maxAlternatives=5;$("sp").textContent="Tinglayapman...";b.classList.add("rec");
 r.onresult=e=>{const w=cur()[0],alts=[...e.results[0]].map(a=>a.transcript.toLowerCase().trim());let good;
  if(sent){const t=norm(cur()[3]);good=alts.some(a=>{const s=norm(a);return t.filter(x=>s.includes(x)).length/t.length>=.7})}
  else good=alts.some(a=>a.includes(w));
  if(good){$("sp").innerHTML='<span class="ok">✅ Ajoyib! "'+alts[0]+'"</span>';mark(w)}
  else $("sp").innerHTML='<span class="bad">Eshitildi: "'+alts[0]+'". Yana urining.</span>'};
 r.onerror=()=>{$("sp").innerHTML='<span class="bad">Mikrofon ruxsatini tekshiring.</span>'};
 r.onend=()=>{b.classList.remove("rec");if($("sp").textContent=="Tinglayapman...")$("sp").textContent=""};try{r.start()}catch(e){b.classList.remove("rec")}};
$("chk").onclick=()=>{const w=cur()[0];if($("inp").value.trim().toLowerCase()==w){$("msg").innerHTML='<span class="ok">✅ To\'g\'ri!</span>';mark(w);shown=true;render();say(sent?cur()[3]:w)}else $("msg").innerHTML='<span class="bad">Noto\'g\'ri, qayta urining</span>'};
$("inp").onkeydown=e=>{if(e.key=="Enter")$("chk").click()};
$("nx").onclick=()=>{i=(i+1)%pool().length;show()};
function tab(n){$("s3").classList.toggle("hide",n!=3);$("t3").className=n==3?"on":"";if(n==3)dShow();$("s1").classList.toggle("hide",n!=1);$("s2").classList.toggle("hide",n!=2);$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)vocab()}
$("t3").onclick=()=>tab(3);$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
let dI=0;const dp=()=>{const p=D[lvl].filter(w=>w[3]);return p.length?p:D[lvl]},dc=()=>{const p=dp();return p[dI%p.length]},dS=()=>dc()[3]||dc()[0];
function dShow(){$("dt").value="";$("dr").textContent="";$("dbg").textContent=lvl+" · "+(dI%dp().length+1)+"/"+dp().length;setTimeout(()=>say(dS()),250)}
function dMark(t,full){const tg=norm(dS()),us=norm(t);return tg.map(w=>{const k=us.indexOf(w);if(k>-1){us[k]=null;return`<span class="g">${w}</span>`}return`<span class="x">${w}</span>`}).join(" ")}
$("dh").onclick=()=>say(dS());$("ds").onclick=()=>say(dS(),.5);
$("dc").onclick=()=>{const t=$("dt").value;if(!norm(t).length)return;const tg=norm(dS()),us=norm(t);
 const ok=tg.length==us.length&&tg.every((w,k)=>w==us[k]);
 if(ok){$("dr").innerHTML='<span class="ok">✅ Mukammal!</span><br>'+dS();mark(dc()[0])}
 else{const hit=tg.filter(w=>us.includes(w)).length;$("dr").innerHTML='<span class="bad">'+Math.round(hit/tg.length*100)+'% to\'g\'ri. Yana urining.</span>'}};
$("da").onclick=()=>{$("dr").innerHTML=dMark($("dt").value)};
$("dn").onclick=()=>{dI=(dI+1)%dp().length;dShow()};
function exs(){$("ex").textContent="Yangi so'zlar Speaking'da: "+(extraOn?"Yoqilgan ✓":"O'chirilgan")}
$("ex").onclick=()=>{extraOn=!extraOn;sm();exs();i=0;show()};exs();
function cs(){try{localStorage.setItem("custom",JSON.stringify(custom))}catch(e){}}
$("ab").onclick=()=>{const w=$("aw").value.trim().toLowerCase(),u=$("au").value.trim(),t=$("as").value.trim();
 if(!/^[a-z' -]+$/.test(w)||!u){$("am").innerHTML='<span class="bad">Inglizcha so\'z va o\'zbekcha ma\'noni kiriting.</span>';return}
 if(Object.values(D).some(a=>a.some(x=>x[0]==w))){$("am").innerHTML='<span class="bad">Bu so\'z allaqachon bor.</span>';return}
 custom.push([w,u,"✍️",t]);D[CK]=custom;cs();mark(w);lvl=CK;i=custom.length-1;dI=0;
 ["aw","au","as"].forEach(k=>$(k).value="");$("am").innerHTML='<span class="ok">✅ Qo\'shildi! Speaking va Diktantda ham chiqadi.</span>';say(w);lvls();vocab();show()};
lvls();show();
</script></body></html>
